<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | ResumeParser</title>

  <!-- Fonts & Icons -->
  <link rel="shortcut icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR6IJ-frlB4jPrBOlWtIwZFr_wy0-cWZo38jZBWXbN3E9l1uQ8ow4EPb9QTd6uzls5r5t4&usqp=CAU" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Shared Style -->
  <link rel="stylesheet" href="../Home Page/style.css" />
</head>

<body class="light-mode">
  <!-- Navbar -->
  <nav class="navbar navbar-dark px-3 sticky-top" style="background-color: #6C63FF;">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold text-white" href="#">
        <i class="fas fa-file-alt me-2"></i> RESUME<span class="text-light">PARSER</span>
      </a>

      <!-- Desktop Menu -->
      <div class="d-none d-lg-flex align-items-center">
        <ul class="navbar-nav flex-row gap-3">
          <li class="nav-item"><a class="nav-link text-white" href="../Home Page/index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="../Output Page/index.html">Output</a></li>
          <li class="nav-item"><a class="nav-link text-white active" href="#">Contact</a></li>
        </ul>
        <button id="theme-toggle" class="btn btn-light ms-3"><i class="fa fa-moon"></i></button>
      </div>

      <!-- Mobile Menu -->
      <div class="d-flex d-lg-none align-items-center">
        <button id="theme-toggle" class="btn btn-light me-2"><i class="fas fa-moon"></i></button>
        <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileMenu"
          aria-controls="mobileMenu" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Offcanvas for Mobile -->
    <div class="offcanvas offcanvas-end text-bg-dark" tabindex="-1" id="mobileMenu">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title">Menu</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
                aria-label="Close"></button>
        </div>
        <div class="offcanvas-body px-4">
            <ul class="navbar-nav">
                <li class="nav-item mb-2">
                    <a class="nav-link text-white" href="../Home Page/index.html">Home</a>
                </li>
                <li class="nav-item mb-2">
                    <a class="nav-link text-white" href="../Output Page/index.html">Output</a>
                </li>
                <li class="nav-item mb-2">
                    <a class="nav-link text-white" href="#">Contact</a>
                </li>
            </ul>
        </div>
    </div>

  <!-- Main Section -->
  <main class="container my-5" style="max-width: 75%;">
    <section class="animate__animated animate__fadeInUp">
      <h2 class="mb-4 section-heading text-center">Contact Us</h2>
      <form>
        <div class="row mb-3">
          <div class="col-md-6">
            <label for="name" class="form-label">Your Name</label>
            <input type="text" class="form-control" id="name" placeholder="Your Name" required>
          </div>
          <div class="col-md-6">
            <label for="email" class="form-label">Your Email</label>
            <input type="email" class="form-control" id="email" placeholder="you@abc.com" required>
          </div>
        </div>
      <div class="row mb-3">
        <div class="col-md-6">
          <label for="phone" class="form-label">Your Phone number</label>
          <input type="tel" class="form-control" id="phone" placeholder="+91 ..." required>
        </div>
        <div class="col-md-6">
          <label for="subject" class="form-label">Subject</label>
          <select class="form-select" id="subject" required>
            <option value="" selected disabled>Choose...</option>
            <option value="feedback">Feedback</option>
            <option value="bug">Bug Report</option>
            <option value="feature">Feature Request</option>
            <option value="support">Support</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>

        <div class="mb-3">
          <label for="message" class="form-label">Your Message</label>
          <textarea class="form-control" id="message" rows="5" placeholder="your message..." required></textarea>
        </div>
        <div class="text-center mb-5">
          <button type="submit" class="btn btn-primary px-4">Send Message</button>
        </div>
      </form>
    </section>
  </main>
  <br><br>
  <!-- Footer -->
  <footer class="text-center py-4 ">
    <p class="mb-0">Made with <i class="fa fa-heart"></i> for Internship Project | Contact: info@resumeparser.com</p>
  </footer>
  <script src="./script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
